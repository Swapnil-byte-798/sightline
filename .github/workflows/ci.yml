name: CI

# Public repository, so GitHub-hosted runners are free and unmetered
# (4 vCPU / 16 GB). CI is this project's entire compute budget, and it is spent
# on the three things a reader should not have to take on trust:
#
#   * the differential oracle (a compiled plan must never admit what check()
#     denies) — a BLOCKING gate, because false_allow has no acceptable non-zero
#     value,
#   * the mutation kill rate — reported on every run, because a test suite's
#     value is how many real bugs it catches, not how many lines it touches,
#   * README drift — every published number is recomputed and diffed against the
#     committed one, so a figure in the README is a measurement rather than a
#     claim.
#
# Everything here is also a Makefile target. A build step that exists only in
# YAML is a build step nobody can reproduce locally.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src
  # Failed runs should be reproducible from the log alone.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests eval examples scripts
      - name: mypy
        run: mypy src/sightline eval

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # Dev extras only. No Qdrant, no Postgres, no ONNX, no model download:
        # if the suite ever needs one of those to pass, the suite has stopped
        # being runnable on a laptop and somebody should notice here first.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with coverage
        run: |
          pytest tests/ -q \
            --cov=sightline --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  oracle:
    name: differential oracle (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Plan must never out-permit check()
        # Exit 1 means a plan admitted something check() denies. That is a
        # breach, not a flaky test: do not rerun it, do not raise a threshold,
        # find the derivation the compiler invented. Exit 2 is a false-deny
        # regression — a quality bug, and also a failure here.
        run: make oracle DOCS=8000 SEED=20240914
      - name: Write the verdict to the run summary
        if: always()
        run: |
          {
            echo "### Differential oracle"
            echo ""
            echo '`false_allow` must be 0. Anything else is a breach.'
          } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: mutation kill rate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Anchors still apply
        # Blocking. A mutation whose anchor no longer matches the source is a
        # mutation that silently stops being applied, and a harness that reports
        # a kill rate for bugs it never planted is worse than no harness.
        run: python -m eval.mutation verify
      - name: Run the fifteen planted permission bugs
        id: run
        # Not blocking on survivors: the kill rate is a measurement, and a
        # measurement that fails the build is a measurement people tune. The
        # survivors are named in the summary, and naming an untested behaviour
        # is the point.
        continue-on-error: true
        run: python -m eval.mutation run --json > mutation.json
      - name: Report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          report = json.load(open("mutation.json"))
          rate = report["kill_rate"]
          print("### Mutation testing\n")
          print(f"**Kill rate: {rate:.0%}** "
                f"({len(report['results'])} mutants, "
                f"{'valid' if report['valid'] else 'INVALID'})\n")
          for result in report["results"]:
              if result["status"] == "survived":
                  print(f"* Survived: **{result['id']} — {result['title']}**. "
                        f"Expected killer: {result['expected_killer']}")
          if not report["valid"]:
              print("\nThe harness could not score this run, so the number above "
                    "means nothing. Failing the job.")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation.json
          if-no-files-found: warn

  readme:
    name: README drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Every published number must match a fresh run
        # The README's placeholders are filled by `make headline`. If a number
        # in the committed README no longer matches what the harness computes,
        # the README is making a claim the code does not support, and that is a
        # failing build rather than a stale document.
        run: make readme-check
      - name: Show the drift
        if: failure()
        run: |
          {
            echo "### README drift"
            echo ""
            echo 'A committed number no longer matches a fresh run.'
            echo 'Regenerate with `make headline` and commit the result.'
            echo ""
            echo '```diff'
            git diff -- README.md | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  demo:
    name: recall collapse example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      # The claim the README leads with has to survive every commit, so it runs
      # as a job rather than sitting in a notebook nobody executes. It also
      # proves the core package works with no dev extras installed.
      - run: python examples/recall_collapse.py
