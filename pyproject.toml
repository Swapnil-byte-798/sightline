[project]
name = "sightline"
version = "0.1.0"
description = "Internal AI search that can only see what you can see - and proves it."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "python-jose[cryptography]>=3.3,<4",
]

[project.optional-dependencies]
# Kept optional so `pip install -e .` stays small and the test suite runs with
# no network. Each extra is exercised by its own CI job.
qdrant = ["qdrant-client>=1.12,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
# ONNX, not torch: this repo is developed on macOS x86_64, where PyTorch ships
# no wheels past 2.2.x. Every model in Sightline runs through onnxruntime.
embed = ["onnxruntime>=1.18,<2", "tokenizers>=0.20,<1"]
oracle = ["faiss-cpu>=1.8,<2"]
obs = ["opentelemetry-sdk>=1.27", "opentelemetry-instrumentation-fastapi>=0.48b0", "prometheus-client>=0.21"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
